name: FCM Test Notification

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Firebase Admin
        run: |
          pip install firebase-admin

      - name: Send FCM Test Notification
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os
          import json
          import firebase_admin
          from firebase_admin import credentials, messaging

          credentials_data = os.environ["FIREBASE_CREDENTIALS"]

          cred = credentials.Certificate(
              json.loads(credentials_data)
          )

          firebase_admin.initialize_app(cred)

          message = messaging.Message(
              notification=messaging.Notification(
                  title="🔔 PBS Notice Alert By Developer",
                  body="FCM Developer Notification সফল হয়েছে! 🎉",
              ),
              data={
                  "click_action": "NOTICE_DETAILS",
                  "url": "https://reb.gov.bd/",
                  "source": "FCM_TEST",
              },
              topic="test_notification_topic",
          )

          response = messaging.send(message)

          print("FCM notification sent successfully!")
          print("Message ID:", response)
          PY
