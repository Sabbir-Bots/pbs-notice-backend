name: PBS Notice Scanner

on:
  # GitHub Actions schedule uses UTC.
  # Bangladesh time (UTC+06:00):
  # 07 UTC = 01:07 PM BST
  # 37 UTC = 01:37 PM BST
  # and so on every hour.
  #
  # We intentionally avoid :00 and :30 because GitHub reports that
  # scheduled workflows can be delayed during periods of high load.
  schedule:
    - cron: '*/5 * * * *'

  # Manual run button in GitHub Actions.
  workflow_dispatch:

# IMPORTANT:
# Never run two scanners at the same time.
# If a new scheduled/manual run starts while the previous scanner
# is still running, the new run waits instead of starting another
# 81-PBS scan in parallel.
concurrency:
  group: pbs-notice-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    # Your 81-source scan can take several minutes.
    # This prevents a stuck runner from running forever.
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Scanner
        run: python scanner.py
        
