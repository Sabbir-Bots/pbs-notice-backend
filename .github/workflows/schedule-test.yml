name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scheduled Test
        run: |
          echo "======================================"
          echo "SCHEDULE WORKED"
          echo "UTC time:"
          date -u
          echo "======================================"
